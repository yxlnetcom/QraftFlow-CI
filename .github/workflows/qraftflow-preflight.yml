name: QraftFlow Candidate Preflight (not authoritative CI)

on:
  push:
    branches: [main]
    paths:
      - 'preflight-requests/**'
  workflow_dispatch:
    inputs:
      BASE_SHA:
        description: Exact private source baseline commit SHA
        required: true
        type: string
      CANDIDATE_TREE_SHA:
        description: Complete unpublished candidate Git tree SHA
        required: true
        type: string
      BATCH_ID:
        description: Approved coherent batch ID
        required: true
        type: string
      STAGE:
        description: Preflight stage; P0_ONLY does not schedule P1
        required: true
        type: choice
        options: [P0_ONLY, FULL]
        default: P0_ONLY

permissions:
  contents: read

concurrency:
  group: qraftflow-preflight-${{ github.event_name == 'push' && github.sha || inputs.CANDIDATE_TREE_SHA }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: yxlnetcom/QraftFlow-Creator-OS

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      candidate_tree_sha: ${{ steps.resolve.outputs.candidate_tree_sha }}
      batch_id: ${{ steps.resolve.outputs.batch_id }}
      stage: ${{ steps.resolve.outputs.stage }}
    steps:
      - name: Checkout trusted public request metadata
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          path: control
      - name: Validate event, approved source, immutable request and fixed identifiers
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_CREATED: ${{ github.event.created }}
          EVENT_DELETED: ${{ github.event.deleted }}
          INPUT_BASE_SHA: ${{ inputs.BASE_SHA }}
          INPUT_CANDIDATE_TREE_SHA: ${{ inputs.CANDIDATE_TREE_SHA }}
          INPUT_BATCH_ID: ${{ inputs.BATCH_ID }}
          INPUT_STAGE: ${{ inputs.STAGE }}
        run: |
          set -euo pipefail
          BASE='fb27377988179da6076fef5107dcba87d1f1980d'
          TREE='17acddb1d3eef9be95238d0cd38253fb88cc142b'
          BATCH='F01-F07-20260928'
          REQUEST='preflight-requests/F01-F07-20260928-p0.txt'
          if [[ "$EVENT_NAME" == 'push' ]]; then
            [[ "$EVENT_REF" == 'refs/heads/main' ]]
            [[ "$EVENT_ACTOR" == 'yxlnetcom' && "$EVENT_SENDER" == 'yxlnetcom' ]]
            [[ "$EVENT_FORCED" != 'true' && "$EVENT_CREATED" != 'true' && "$EVENT_DELETED" != 'true' ]]
            [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ && "$EVENT_AFTER" =~ ^[0-9a-f]{40}$ ]]
            cd control
            [[ "$(git rev-parse HEAD)" == "$EVENT_AFTER" ]]
            [[ "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" == '2' ]]
            [[ "$(git rev-parse HEAD^)" == "$EVENT_BEFORE" ]]
            # Exactly one newly added, fixed-name request. Reject mixed source/workflow edits.
            [[ "$(git diff-tree --no-commit-id --name-status -r HEAD^ HEAD)" == $'A\t'"$REQUEST" ]]
            [[ -f "$REQUEST" && ! -L "$REQUEST" ]]
            expected=$(mktemp)
            trap 'rm -f "$expected"' EXIT
            printf 'BASE_SHA=%s\nCANDIDATE_TREE_SHA=%s\nBATCH_ID=%s\n' "$BASE" "$TREE" "$BATCH" > "$expected"
            cmp -s "$expected" "$REQUEST"
            stage='P0_ONLY'
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$EVENT_REF" == 'refs/heads/main' ]]
            [[ "$EVENT_ACTOR" == 'yxlnetcom' && "$EVENT_SENDER" == 'yxlnetcom' ]]
            [[ "$INPUT_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$INPUT_CANDIDATE_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$INPUT_BASE_SHA" == "$BASE" && "$INPUT_CANDIDATE_TREE_SHA" == "$TREE" && "$INPUT_BATCH_ID" == "$BATCH" ]]
            [[ "$INPUT_STAGE" == 'P0_ONLY' || "$INPUT_STAGE" == 'FULL' ]]
            stage="$INPUT_STAGE"
          else
            exit 1
          fi
          printf 'base_sha=%s\ncandidate_tree_sha=%s\nbatch_id=%s\nstage=%s\n' "$BASE" "$TREE" "$BATCH" "$stage" >> "$GITHUB_OUTPUT"
          echo 'INPUT_VALIDATION PASS'

  p0-delivery:
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted public preflight control code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Trusted script static self-test
        run: python3 control/scripts/preflight_restore.py selftest
      - name: Checkout exact private baseline; do not persist credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.validate-inputs.outputs.base_sha }}
          token: ${{ secrets.QRAFTFLOW_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Restore and verify candidate snapshot (token scoped to this step)
        shell: bash
        env:
          QF_PREFLIGHT_READ_TOKEN: ${{ secrets.QRAFTFLOW_SOURCE_TOKEN }}
          BASE_SHA: ${{ needs.validate-inputs.outputs.base_sha }}
          CANDIDATE_TREE_SHA: ${{ needs.validate-inputs.outputs.candidate_tree_sha }}
          BATCH_ID: ${{ needs.validate-inputs.outputs.batch_id }}
        run: |
          set -euo pipefail
          python3 control/scripts/preflight_restore.py restore \
            --base-sha "$BASE_SHA" \
            --candidate-tree-sha "$CANDIDATE_TREE_SHA" \
            --batch-id "$BATCH_ID" \
            --workspace source
      - name: Prove read-token absence in later steps
        run: python3 control/scripts/preflight_restore.py audit --workspace source

  p1-linux:
    needs: [validate-inputs, p0-delivery]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.validate-inputs.outputs.stage == 'FULL' && needs.p0-delivery.result == 'success' }}
    runs-on: ubuntu-latest
    container: swift:5.10
    timeout-minutes: 60
    steps:
      - name: Checkout trusted public preflight control code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Install Linux test dependencies
        run: |
          apt-get update >/dev/null 2>&1
          apt-get install -y libsqlite3-dev zip unzip nodejs python3 >/dev/null 2>&1
      - name: Checkout exact private baseline; do not persist credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.validate-inputs.outputs.base_sha }}
          token: ${{ secrets.QRAFTFLOW_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Mark container checkout safe for local Git verification
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/source"
      - name: Independently restore full candidate; token scoped to this step
        shell: bash
        env:
          QF_PREFLIGHT_READ_TOKEN: ${{ secrets.QRAFTFLOW_SOURCE_TOKEN }}
          BASE_SHA: ${{ needs.validate-inputs.outputs.base_sha }}
          CANDIDATE_TREE_SHA: ${{ needs.validate-inputs.outputs.candidate_tree_sha }}
          BATCH_ID: ${{ needs.validate-inputs.outputs.batch_id }}
        run: |
          set -euo pipefail
          python3 control/scripts/preflight_restore.py restore --base-sha "$BASE_SHA" \
            --candidate-tree-sha "$CANDIDATE_TREE_SHA" --batch-id "$BATCH_ID" --workspace source
      - name: Check token separation and test real Linux candidate
        run: |
          set -euo pipefail
          python3 control/scripts/preflight_restore.py audit --workspace source
          swift --version
          python3 control/scripts/preflight_restore.py test --workspace source --platform linux

  p1-macos:
    needs: [validate-inputs, p0-delivery]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.validate-inputs.outputs.stage == 'FULL' && needs.p0-delivery.result == 'success' }}
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - name: Checkout trusted public preflight control code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Checkout exact private baseline; do not persist credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.validate-inputs.outputs.base_sha }}
          token: ${{ secrets.QRAFTFLOW_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Independently restore full candidate; token scoped to this step
        shell: bash
        env:
          QF_PREFLIGHT_READ_TOKEN: ${{ secrets.QRAFTFLOW_SOURCE_TOKEN }}
          BASE_SHA: ${{ needs.validate-inputs.outputs.base_sha }}
          CANDIDATE_TREE_SHA: ${{ needs.validate-inputs.outputs.candidate_tree_sha }}
          BATCH_ID: ${{ needs.validate-inputs.outputs.batch_id }}
        run: |
          set -euo pipefail
          python3 control/scripts/preflight_restore.py restore --base-sha "$BASE_SHA" \
            --candidate-tree-sha "$CANDIDATE_TREE_SHA" --batch-id "$BATCH_ID" --workspace source
      - name: Check token separation and test real macOS candidate
        run: |
          set -euo pipefail
          python3 control/scripts/preflight_restore.py audit --workspace source
          swift --version
          xcodebuild -version
          uname -m
          sw_vers
          python3 control/scripts/preflight_restore.py test --workspace source --platform macos
